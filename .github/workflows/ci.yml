name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches @types/node's ^20 range in package.json — the Node LTS this
  # project is actually built against.
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Data validation
        run: npm run validate:content

      - name: Task contract audit
        run: npm run task:contract

      - name: Screen contract check (ci mode)
        run: npm run screen:contract -- --mode=ci

      - name: Build
        run: npm run build

  public-smoke:
    name: Public Smoke (Playwright, no auth required)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e/public-smoke.spec.ts needs no Supabase secret — it only
      # covers logged-out flows (E2E-001~005). tests/e2e/auth-smoke.spec.ts
      # (E2E-006~007) is intentionally NOT run here: it is not a required
      # GitHub Actions gate (see docs/DECISION_LOG.md DEC-018) and self-skips
      # without E2E_TEST_EMAIL/E2E_TEST_PASSWORD, which this workflow never
      # sets.
      - name: Run public smoke tests
        run: npm run test:e2e:public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
